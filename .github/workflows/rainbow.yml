# Felucca, built by GitHub and published to this fork's GitHub Pages site.
#   firmware:  the FM-1 package (JieLi toolchain + three files of the AC79 SDK, cached after the first run)
#   browser:   the same firmware compiled to WebAssembly (Felucca in the browser)
#   publish:   the site: /webapp/installer/ flashes the FM-1, /webapp/try/ runs it in the browser
# Two firmware packages: the public one (a plain "HI!" at power-up) goes on the site's installer; with the secrets
# KID_NAME (a child's name) and PRIVATE_PATH (a long random word) set, a second one that greets them by name goes to a
# private address on the same site: https://USER.github.io/REPO/PRIVATE_PATH/ (not listed anywhere, not indexed;
# anyone who learns the address can open it, so it is not for posting).
# The browser version needs nothing from JieLi, so it is published even if the firmware job fails. It is tested
# first (web/emu/emu_test.mjs, and web/emu/kid_test.mjs for Rainbow mode): a red test publishes nothing.
# Setup: Actions enabled on the fork, and Settings > Pages > Source set to "GitHub Actions".
name: rainbow

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  SDK_TAG: AC79NN_SDK_V1.2.1_2023-12-13   # the SDK version build.py was tested with
  EMSDK_VERSION: 3.1.74
  BUILD_TAG: rb                           # added to the version, so ABOUT shows this is our build (v1.0.5.2-rb)

jobs:
  firmware:
    runs-on: ubuntu-24.04
    outputs:
      release: ${{ steps.ver.outputs.release }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python packages
        run: pip install Pillow fonttools

      - name: Version
        id: ver
        run: |
          v=$(sed -n 's/^#define FELUCCA_VERSION "v\([^"]*\)".*/\1/p' firmware/src/felucca.c)
          echo "release=$v-$BUILD_TAG" >> "$GITHUB_OUTPUT"
          echo "Building Felucca $v-$BUILD_TAG"

      - name: Restore the JieLi toolchain and SDK
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.jieli
            ~/ac79-sdk
          key: jieli-${{ env.SDK_TAG }}-v1

      - name: Download the JieLi toolchain
        if: steps.cache.outputs.cache-hit != 'true'
        run: sh tools/get_toolchain.sh

      - name: Download the JieLi AC79 SDK (only cpu/wl82/tools is used)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          for i in 1 2 3; do
            git clone --depth 1 --branch "$SDK_TAG" https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git "$RUNNER_TEMP/sdk" && break
            echo "clone failed (try $i), retrying"; rm -rf "$RUNNER_TEMP/sdk"; sleep 30
          done
          mkdir -p ~/ac79-sdk/cpu/wl82
          cp -r "$RUNNER_TEMP/sdk/cpu/wl82/tools" ~/ac79-sdk/cpu/wl82/
          rm -rf "$RUNNER_TEMP/sdk"
          ls -la ~/ac79-sdk/cpu/wl82/tools/uboot.boot ~/ac79-sdk/cpu/wl82/tools/cfg_tool.bin ~/ac79-sdk/cpu/wl82/tools/cfg/eq_cfg_hw.bin

      - name: Save the JieLi toolchain and SDK
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.jieli
            ~/ac79-sdk
          key: jieli-${{ env.SDK_TAG }}-v1

      - name: Check the toolchain runs here (otherwise use Docker, as on macOS)
        run: |
          clang="$HOME/.jieli/toolchain/pi32v2/bin/clang"
          if "$clang" --version; then
            echo "toolchain runs natively"
          else
            ldd "$clang" || true
            echo "toolchain does not run natively; building in a debian:bookworm-slim container"
            echo "JIELI_DOCKER=1" >> "$GITHUB_ENV"
          fi

      - name: Build the public firmware (no name in it)
        run: |
          export AC79_SDK="$HOME/ac79-sdk"
          rel="${{ steps.ver.outputs.release }}"
          ./build.sh --release "$rel"
          mkdir -p out/public
          cp "build/felucca-$rel.fwsc" out/public/

      - name: Build the private firmware (only when KID_NAME and PRIVATE_PATH are both set)
        env:
          KID_NAME: ${{ secrets.KID_NAME }}
          PRIVATE_PATH: ${{ secrets.PRIVATE_PATH }}
        run: |
          if [ -z "$KID_NAME" ] || [ -z "$PRIVATE_PATH" ]; then
            echo "::notice::No private firmware: set the repository secrets KID_NAME and PRIVATE_PATH to get one"
            exit 0
          fi
          if ! printf '%s' "$PRIVATE_PATH" | grep -Eq '^[A-Za-z0-9_-]{12,64}$'; then
            echo "::error::PRIVATE_PATH must be 12 to 64 letters, digits, - or _"
            exit 1
          fi
          export AC79_SDK="$HOME/ac79-sdk"
          rel="${{ steps.ver.outputs.release }}"
          ./build.sh --release "$rel"
          mkdir -p out/private
          cp "build/felucca-$rel.fwsc" out/private/

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: out
          if-no-files-found: error

  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python packages
        run: pip install Pillow fonttools

      - name: Generated headers (fonts, icons, tables, samples), as build.py makes them
        run: python3 -c "import sys; sys.path.insert(0, 'tools'); import build; build.generate()"

      - name: Restore Emscripten
        id: emcache
        uses: actions/cache@v4
        with:
          path: ~/emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}-v1

      - name: Install Emscripten
        if: steps.emcache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git ~/emsdk
          ~/emsdk/emsdk install "$EMSDK_VERSION"

      - name: Build Felucca for the browser
        run: |
          ~/emsdk/emsdk activate "$EMSDK_VERSION" >/dev/null
          . ~/emsdk/emsdk_env.sh >/dev/null
          EMU_PREVIEW=0 sh web/emu/build.sh

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test the browser build (Felucca's own checks, then Rainbow mode's)
        run: |
          node web/emu/emu_test.mjs build/emu/felucca.wasm
          if [ -f web/emu/kid_test.mjs ]; then node web/emu/kid_test.mjs build/emu/felucca.wasm; fi

      - uses: actions/upload-artifact@v4
        with:
          name: browser
          path: build/emu
          if-no-files-found: error

  publish:
    needs: [firmware, browser]
    if: always() && needs.browser.result == 'success'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Get the browser build
        uses: actions/download-artifact@v4
        with:
          name: browser
          path: site/webapp/try

      - name: Get the firmware
        if: needs.firmware.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: firmware
          path: fw

      - name: Make the site
        env:
          PRIVATE_PATH: ${{ secrets.PRIVATE_PATH }}
        run: |
          rel="${{ needs.firmware.outputs.release }}"
          if [ -f "fw/public/felucca-$rel.fwsc" ]; then
            python3 web/make_site.py "fw/public/felucca-$rel.fwsc" "$rel" site
            if [ -f "fw/private/felucca-$rel.fwsc" ] && [ -n "$PRIVATE_PATH" ]; then
              python3 web/make_site.py "fw/private/felucca-$rel.fwsc" "$rel" private-site
              find private-site -name '*.html' -exec sed -i 's|<meta charset="utf-8">|<meta charset="utf-8"><meta name="robots" content="noindex">|' {} +
              mv private-site "site/$PRIVATE_PATH"
              echo "::notice::The private installer is on the site (PRIVATE_PATH)"
            fi
          else
            echo "::warning::No firmware this run; publishing the browser version only (no installer)"
          fi
          touch site/.nojekyll
          find site -type f | sort

      - id: pages
        uses: actions/configure-pages@v5

      - name: The landing page (the one link to share)
        env:
          DONATE: ${{ vars.DONATE_URL || secrets.DONATE_URL }}   # the tip link (a repository variable or secret: Ko-fi,
                                                                 # Buy Me a Coffee ...); none, no tip card
        run: |
          cp -r landing/. site/
          repo="${{ github.repository }}"
          sed -i -e "s|@SITE@|${{ steps.pages.outputs.base_url }}|g" -e "s|@REPO@|$repo|g" site/index.html
          find site -name '*.html' -exec sed -i "s|@REPO@|$repo|g" {} +   # (the installers' credits)
          d=$(printf '%s' "$DONATE" | tr -d '[:space:]')   # (pasted on a phone: spaces, a line break, no https://)
          case "$d" in
            "") ;;
            https://*) ;;
            http://*) d="https://${d#http://}" ;;
            *) d="https://$d" ;;
          esac
          if printf '%s' "$d" | grep -Eq '^https://[A-Za-z0-9.-]+\.[A-Za-z]{2,}(/[A-Za-z0-9./?=_%:+~#@&-]*)?$'; then
            esc=$(printf '%s' "$d" | sed -e 's/[&|\\]/\\&/g')
            sed -i "s|@DONATE@|$esc|g" site/index.html
            echo "tip card: on"
          else
            perl -0pi -e 's/\s*<!--DONATE-->.*?<!--\/DONATE-->//s' site/index.html
            if [ -n "$d" ]; then echo "::warning::DONATE_URL is set but does not look like a web link (https://...): no tip card"
            else echo "tip card: off (no DONATE_URL)"; fi
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
