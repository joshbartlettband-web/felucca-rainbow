# SPDX-License-Identifier: GPL-3.0-only
# FM-1 Rescue, the Android app (android/): test the rescue core against a simulated FM-1, build the APK, and
# publish it as the prerelease "fm1-rescue-test" so a phone can download it directly.
name: FM-1 Rescue (Android app)

on:
  push:
    paths: ["android/**", ".github/workflows/fm1-rescue.yml"]
  workflow_dispatch:

permissions:
  contents: write                 # the prerelease

concurrency:
  group: fm1-rescue
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: The rescue core against a simulated FM-1
        working-directory: android/core-test
        run: |
          curl -fsSL -o wl82loader.bin "https://raw.githubusercontent.com/kagaimiq/jl-uboot-tool/c32b28e7a04f873f526ba929cb1bae9f05442fe9/data/loaderblobs/usb/wl82loader.bin"
          echo "d41da6126760c9d66660bcc0cac8d27d221806c5e369a8036921efe68dca5376  wl82loader.bin" | sha256sum -c
          javac --release 17 -d build $(find ../app/src/main/java -path '*core*' -name '*.java') SimTest.java
          java -cp build SimTest wl82loader.bin

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build the APK
        run: gradle -p android :app:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: fm1-rescue-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish the test build (prerelease fm1-rescue-test)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk fm1-rescue.apk
          sha=$(sha256sum fm1-rescue.apk | cut -d' ' -f1)
          gh release delete fm1-rescue-test --yes --cleanup-tag || true
          gh release create fm1-rescue-test fm1-rescue.apk --prerelease --target "$GITHUB_SHA" \
            --title "FM-1 Rescue (test build)" \
            --notes "A test build of FM-1 Rescue (android/README.md), from ${GITHUB_REF_NAME} at ${GITHUB_SHA::7}. APK sha256: ${sha}. Debug-signed: uninstall the previous test build before installing a new one."
